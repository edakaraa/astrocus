name: Weekly Reports Cron

on:
  schedule:
    # Pazartesi 00:00 Europe/Istanbul (UTC+3) = Pazar 21:00 UTC
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Eksik haftaları doldur (true/false)"
        required: false
        default: "true"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke generate-weekly-reports
        env:
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.backfill || 'true') || 'false' }}
        run: |
          if [ -z "$SUPABASE_FUNCTIONS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SUPABASE_FUNCTIONS_URL veya CRON_SECRET repo secrets'ta tanımlı değil."
            echo "GitHub → Settings → Secrets → Actions veya Supabase pg_cron (migration 030) kullanın."
            exit 1
          fi
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"backfill\": $BACKFILL}"
